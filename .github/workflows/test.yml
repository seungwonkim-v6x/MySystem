name: pi-environment

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Check Pi extension syntax
        run: node --experimental-strip-types --check .pi/extensions/pi-safety.ts
      - name: Run Pi environment contracts
        run: node --experimental-strip-types tests/pi-environment.mjs
      - name: Check bootstrap scripts
        run: bash -n setup.sh install.sh
